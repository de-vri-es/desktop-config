Shift+L cycle-values loop-playlist inf no
Ctrl+l cycle-values loop-file inf no

# Secondary subtitles
Alt+j cycle secondary-sid
Alt+J cycle secondary-sid down
Ctrl+Alt+Shift+Right no-osd sub-step +1 secondary
Ctrl+Alt+Shift+Left no-osd sub-step -1 secondary
Ctrl+Alt+Right no-osd sub-seek +1 secondary
Ctrl+Alt+Left no-osd sub-seek -1 secondary

Alt+Shift+Right cycle-values video-rotate 0 90 180 270
Alt+Shift+Left cycle-values video-rotate 0 270 180 90
